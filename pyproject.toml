[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelup"
version = "0.1.0"
description = "Simple Real-ESRGAN desktop upscaler"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
authors = [
  { name = "Yoshinao Inoguchi", email = "yoshinao@inoguchi.com" },
]
dependencies = [
  "PySide6==6.11.2",
  "Pillow==12.3.0",
  "pillow-heif==1.5.0",
  "filelock==3.32.3",
  "numpy==2.5.2",
  "torch==2.13.0",
  "opencv-python==5.0.0.93",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]
# Packaging-only: the freezer that builds the double-click .app/.exe. Kept out of the
# runtime deps (test_packaging.py pins those) and out of dev so a normal test/dev sync
# stays lean — `uv sync --extra build` is only needed by scripts/package.* and CI.
build = [
  "pyinstaller==6.22.2",
]

[project.gui-scripts]
pixelup = "pixelup.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixelup = ["resources/*.png"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Coverage is an instrument, not a gate (no threshold / CI fail) — it maps where logic still
# hides in the Qt layer. Run: `uv run pytest --cov --cov-report=term-missing --cov-report=html`.
[tool.coverage.run]
branch = true
source = ["pixelup"]
omit = [
  # The `python -m pixelup` / gui:main entry shells — untestable bootstrap, no logic.
  "*/pixelup/__main__.py",
]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
# Gitignored, alongside the rest of the fleet's coverage output.
directory = "coverage"
