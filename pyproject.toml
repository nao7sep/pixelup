[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelup"
version = "0.1.0"
description = "Single-image Real-ESRGAN upscaler CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Yoshinao Inoguchi", email = "nao7sep@gmail.com" },
]
dependencies = [
  "typer==0.25.0",
  "rich==15.0.0",
  "Pillow==12.2.0",
  "pillow-heif==1.3.0",
  "filelock==3.29.0",
  "platformdirs==4.9.6",
  "numpy==2.4.4",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "opencv-python==4.13.0.92",
  "realesrgan==0.3.0",
  "basicsr-fixed==1.4.2",
  "gfpgan==1.3.8",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.15.12",
]

[project.scripts]
pixelup = "pixelup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
