[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelup"
version = "0.1.0"
description = "Simple Real-ESRGAN desktop upscaler"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Yoshinao Inoguchi", email = "nao7sep@gmail.com" },
]
dependencies = [
  "PySide6==6.11.0",
  "Pillow==12.2.0",
  "pillow-heif==1.3.0",
  "filelock==3.29.0",
  "numpy==2.4.4",
  "torch==2.12.1",
  "torchvision==0.27.1",
  "opencv-python==4.13.0.92",
  "realesrgan==0.3.0",
  "basicsr-fixed==1.4.2",
  "gfpgan==1.3.8",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.15.12",
]

[project.gui-scripts]
pixelup = "pixelup.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixelup = ["resources/*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Coverage is an instrument, not a gate (no threshold / CI fail) — it maps where logic still
# hides in the Qt layer. Run: `uv run pytest --cov --cov-report=term-missing --cov-report=html`.
[tool.coverage.run]
branch = true
source = ["pixelup"]
omit = [
  # The `python -m pixelup` / gui:main entry shells — untestable bootstrap, no logic.
  "*/pixelup/__main__.py",
]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
# Gitignored, alongside the rest of the fleet's coverage output.
directory = "coverage"
