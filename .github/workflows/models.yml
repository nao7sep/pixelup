name: Build ncnn models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra model-build
      - name: Convert and validate pinned models
        run: >-
          uv run python scripts/convert_ncnn_models.py
          --download-sources .model-sources dist/ncnn-models
      - name: Upload private model candidates
        uses: actions/upload-artifact@v7
        with:
          name: pixelup-ncnn-models-${{ github.sha }}
          path: dist/ncnn-models/
          if-no-files-found: error
          retention-days: 1
